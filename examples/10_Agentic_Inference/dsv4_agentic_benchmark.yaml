name: "deepseek-v4.1-flash-agentic-benchmark"
version: "1.0"
type: "online"

submission_ref:
  model: deepseek-ai/DeepSeek-V4.1-Flash
  ruleset: mlperf-endpoints-v1.0-2026-10-C1-A

model_params:
  name: "deepseek-ai/DeepSeek-V4.1-Flash"
  tokenizer_name: "${MODEL_PATH}"
  temperature: 1.0
  top_k: 0
  top_p: 0.95
  max_new_tokens: 8192
  streaming: "on"
  chat_template_kwargs:
    thinking: true
    reasoning_effort: max

datasets:
  - name: agentic_combined
    type: performance
    path: /path/to/agentic_combined.jsonl
    accuracy_config:
      eval_method: agentic_inference_inline # required benchmark default.
      num_repeats: 1
    agentic_inference:
      turn_timeout_s: 86400.0
      enable_salt: true # required benchmark default.
      inject_tool_delay: true
      num_trajectories_to_issue: 613 # Should be integer multiple of 613.
      # Required benchmark default; set to true only for faster optimization/debug runs.
      stop_issuing_on_first_user_complete: false
  - name: swe_bench
    type: accuracy
    accuracy_config:
      eval_method: swe_bench_scorer
      num_repeats: 1
      extras:
        swebench_service_url: http://127.0.0.1:18080
        swebench_service_auth_token: dsv41-swebench-20260918
        subset: verified
        split: test
        num_instances: 200
        workers: 16
        max_eval_workers: 16
        service_timeout_s: 86400
        poll_interval_s: 5

settings:
  load_pattern:
    type: agentic_inference
    target_concurrency: 32 # Submission-specific concurrency.

  client:
    warmup_connections: 0
    max_idle_time: 0.5

endpoint_config:
  endpoints:
    - "http://localhost:8000"
  api_type: openai

report_dir: logs/deepseek_v4_1_flash_agentic
