name: "deepseek-v4-pro-sglang-lcb-pass1"
version: "1.0"
type: "online"
timeout: 1209600

model_params:
  name: "/data/workloads-inference/hf_hub_cache/models--deepseek-ai--DeepSeek-V4-Pro/snapshots/b5968e9190ef611bbf34a7229255be88a0e937c1"
  temperature: 1.0
  max_new_tokens: 256000
  top_k: -1
  top_p: 1.0
  streaming: "on"
  chat_template_kwargs:
    thinking: true
    reasoning_effort: max

datasets:
  - name: "perf-stub"
    type: "performance"
    path: "examples/10_DeepSeekV4Pro_Example/data/perf_stub.jsonl"
    samples: 1
    parser:
      prompt: "text_input"
  - name: "livecodebench::deepseek_v4"
    type: "accuracy"
    accuracy_config:
      eval_method: "code_bench_scorer"
      extractor: "python_code_extractor"
      num_repeats: 1

settings:
  runtime:
    min_duration_ms: 100
    max_duration_ms: 0
    scheduler_random_seed: 42
    dataloader_random_seed: 42

  load_pattern:
    type: "concurrency"
    target_concurrency: 64

  client:
    num_workers: 64
    worker_initialization_timeout: 600.0

  warmup:
    enabled: false

  drain:
    metrics_drain_timeout_s: 900.0
    metrics_tokenizer_workers: 8

endpoint_config:
  endpoints:
    - "http://127.0.0.1:30000"
  api_key: null
  api_type: "openai"

report_dir: "results/sglang_deepseek_v4_pro_lcb_pass1/"
