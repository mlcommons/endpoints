name: "gpt-oss-120b-benchmark"
version: "1.0"
type: "online"

model_params:
  name: "openai/gpt-oss-120b"
  temperature: 1.0
  max_new_tokens: 32768
  top_k: -1
  top_p: 1.0
  streaming: "on"

datasets:
  - name: "perf-test"
    type: "performance"
    path: "examples/04_GPTOSS120B_Example/data/perf_eval_ref.parquet"

settings:
  runtime:
    max_issue_duration_ms: 6000 # 6 s cap on the performance phase (short smoke run)
    n_samples_to_issue: 6396 # One performance dataset pass
    scheduler_random_seed: 42
    dataloader_random_seed: 42

  load_pattern:
    type: "concurrency"
    target_concurrency: 512

  client:
    num_workers: 4

endpoint_config:
  endpoints:
    - "http://localhost:30000"
  api_key: null
  api_type: "sglang"

report_dir: "results/gptoss_120b_benchmark_mlperf/"
