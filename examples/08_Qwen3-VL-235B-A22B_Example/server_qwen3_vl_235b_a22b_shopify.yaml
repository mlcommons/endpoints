# Online (Server) Benchmark - Qwen3-VL-235B-A22B on Shopify Product Catalogue
name: "online-qwen3-vl-235b-a22b-shopify-benchmark"
version: "1.0"
type: "online"

model_params:
  name: "Qwen/Qwen3-VL-235B-A22B-Instruct"
  max_new_tokens: 150
  streaming: "on" # Required for TTFT/TPOT measurement

datasets:
  - name: shopify_product_catalogue::q3vl
    type: "performance"
  - name: shopify_product_catalogue::q3vl
    type: "accuracy"
    accuracy_config:
      eval_method: "shopify_category_f1"
      ground_truth: "ground_truth_category"
      extractor: "identity_extractor"
      num_repeats: 1

settings:
  runtime:
    n_samples_to_issue: 48289 # One performance dataset pass
    scheduler_random_seed: 42
    dataloader_random_seed: 42

  load_pattern:
    type: "poisson"
    target_qps: 5

  client:
    # Increase for slow worker startup (spawn, imports). Default 60s may be too short.
    worker_initialization_timeout: 120
    num_workers: 5
    transport:
      type: zmq
      recv_buffer_size: 16777216
      send_buffer_size: 16777216
    max_connections: 1000

  warmup:
    enabled: true # Enable warmup phase before performance run
    n_requests: 1600 # Warmup request count (None = full dataset once)
    salt: false

endpoint_config:
  endpoints:
    - "http://localhost:8000"
  api_key: null

report_dir: results/qwen3_vl_235b_a22b_shopify_benchmark_online/
