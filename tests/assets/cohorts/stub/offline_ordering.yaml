# Stub check: Offline ordering (Endpoints Policy Section 5.7.2).
#
# Representative stub per PR-1's "machinery + stubs" directive. The `when`
# guard matches the prose's "for a dedicated Offline run / not applicable to an
# elected point"; the `assert` reads the named derivation already landed on
# `Submission` (Section 5.7.2's pair of clauses).
id: offline_ordering
description: The dedicated Offline run shall meet the Section 5.7.2 throughput and concurrency clauses.
rule: "Endpoints Policy Section 5.7.2, Relationship to Maximum Supported Concurrency."
fix: Either raise the dedicated Offline run's system_tps to at least 0.98x the C_max point's, or elect the C_max point as the Offline result instead.
severity: warn
scope: point
when:
  - left: point.yaml.offline
    op: eq
    right: dedicated
assert:
  - left: submission.offline_ordering
    op: eq
    right: true