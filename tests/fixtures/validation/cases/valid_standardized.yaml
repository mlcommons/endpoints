        components:
          cpu:
            model: AMD EPYC 9654
            count_per_node: 2
            tdp_per_unit:
              value_w: 350
              source_type: vendor_spec
              source: https://example.com/cpu-spec
          accelerator:
            model: NVIDIA H100 SXM5 80GB
            count_per_node: 8
            tdp_per_unit:
              value_w: 700
              source_type: vendor_spec
              source: https://example.com/accelerator-spec
          scale_up_network:
