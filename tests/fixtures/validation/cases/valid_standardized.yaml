    shared_docs: docs
    shared_src: src
    steady_state:
      state:
        tpot_p50: Plateau
        tpot_p90: Plateau
        ttft_p50: Plateau
        ttft_p90: Plateau
      status: windowable
      verdict: STEADY STATE
      window:
        n_samples: 4000
        super_pass_end: 4
        super_pass_size: 1000
        super_pass_start: 1
    target_cohort: 2026-10-C1
    warmup:
      data_source: llm-perf-dataset-v1 validation split
      duration_s: 60.0
      initialization_steps:
        - model loaded
        - kv-cache warmed
      link_logs: https://example.com/warmup-logs
      logs_retained: true
