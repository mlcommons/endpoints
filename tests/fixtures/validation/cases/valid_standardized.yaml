            switch_count: 1
            tdp_per_switch:
              value_w: 3500
              source_type: vendor_spec
              source: https://example.com/switch-spec
    scale_out:
      present: false
  src/llama3_1-8b/.gitkeep: ""
  src/llama3_1-8b/README.md: "# llama3_1-8b


    How to build the SUT and reproduce a Pareto point.

    "
  src/vllm/README.md: "# vllm


    Anonymised fixture implementation directory. Real submissions document how to build the SUT and reproduce
    a point here.

    "
