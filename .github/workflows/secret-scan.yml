name: Secret Scan

# Every branch, not just main: a branch is public as soon as it is pushed, so
# the scan has to fail on the branch itself. Rules live in .gitleaks.toml.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action needs a license key secret for organization
      # repos, and secrets are unavailable to PRs from forks.
      - uses: ./.github/actions/install-gitleaks

      - name: Scan commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$REF_NAME" = "main" ]; then
            range="HEAD"
          else
            range="origin/main..HEAD"
          fi
          gitleaks git --redact --verbose --log-opts="$range" .
