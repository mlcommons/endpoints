# Per-run checks (`results/<system>/<model>/r<N>/`), every row citing the
# Endpoints Policy section it enforces (pinned at 4ba8224dc746).
#
# Scope of this first version: the checks a row can decide from one run's own
# artifacts. Rules that need cross-point arithmetic, catalog-conditional
# rescaling or the power model are listed in ../README.md under "Not yet
# expressible" with the reason; the vocabulary-only rules (an `offline` value
# outside §8.3's three, a `region` outside §8.3's six, a steady-state verdict
# outside §4.4's vocabulary, a `load_pattern` outside §6.1's patterns) are
# enforced by this cohort's `valid_refs.yaml` notes at collect time, not by
# rows here.

point_disclosure_complete:
  description: Every §8.3 disclosure field is present and non-blank (empty or whitespace-only values fail).
  rule: "Endpoints Policy §8.3, Measurement Point (point.yaml); §1, Submission completeness."
  fix: Add the field to this run's point.yaml with content (a blank value fails it) and re-submit.
  severity: fail
  assert:
    - { left: point.config.division, op: non_blank }
    - { left: point.config.max_supported_concurrency, op: exists }
    - { left: point.config.model_name, op: non_blank }
    - { left: point.config.model_precision, op: non_blank }
    - { left: point.config.link_to_model, op: non_blank }
    - { left: point.config.dataset_name, op: non_blank }
    - { left: point.config.dataset_type, op: non_blank }
    - { left: point.config.dataset_link, op: non_blank }
    - { left: point.config.shared_src, op: non_blank }
    - { left: point.config.shared_docs, op: non_blank }
    - { left: point.config.seed_set, op: non_blank }
    - { left: point.config.target_cohort, op: non_blank }

point_run_complete:
  description: The run completed; a drain timeout or interrupt leaves it incomplete.
  rule: "Endpoints Policy §9.1, Automated Checks; §1, Submission completeness."
  fix: "Re-run this point to completion (`complete: false` marks a drain timeout or an interrupted run)."
  severity: fail
  # The completion marker the client's own summary writes; a canonical
  # `result_summary.json` (PointSummary) carries none, so this row judges the
  # marker where a run recorded it.
  when:
    - { left: point.result_summary.complete, op: exists }
  assert:
    - { left: point.result_summary.complete, op: eq, right: true }

point_target_cohort_shape:
  description: The declared target cohort reads YYYY-MM-C0/C1 (§4.2's calendar).
  rule: "Endpoints Policy §4.6, Seeds."
  fix: Set `target_cohort` to the cohort the run was issued for, e.g. 2026-10-C1.
  severity: fail
  assert:
    - left: point.config.target_cohort
      op: matches
      right: { literal: "[0-9]{4}-[0-9]{2}-C[01]" }

point_seed_set_membership:
  description: The declared seed set is one this cohort published (§4.6).
  rule: "Endpoints Policy §4.6, Seeds."
  fix: Set `seed_set` to a published set id (this cohort publishes A).
  severity: fail
  assert:
    - { left: point.config.seed_set, op: in, right: [A] }

point_seed_set_adoption:
  description: The run's target cohort sits inside the set's four-cohort window.
  rule: "Endpoints Policy §4.6, Seeds."
  fix: Bind the run to a cohort where set A is still adoptable (through 2026-12-C0).
  severity: fail
  assert:
    - left: point.config.target_cohort
      op: in
      right: [2026-10-C1, 2026-11-C0, 2026-11-C1, 2026-12-C0]

# Set A also publishes a `model_seed`; the client never records one (its purpose
# is undocumented in the policies), so no client artifact can carry it - a
# server-side artifact would be needed to check it.
point_seed_runtime_match:
  description: The recorded runtime seeds equal the published set A values.
  rule: "Endpoints Policy §2.1.1, Run Configuration; §4.6, Seeds."
  fix: "Bind the run to the set A ruleset (`submission_ref.ruleset: endpoints-v1.0-2026-10-C1-A`) and re-run."
  severity: fail
  assert:
    - left: point.config.runtime_settings.runtime.scheduler_rng_seed
      op: eq
      right: 10487924139932647040
    - left: point.config.runtime_settings.runtime.sample_index_rng_seed
      op: eq
      right: 586478644936801402

point_api_key_redacted:
  description: A present client API key carries no secret (empty or redacted).
  rule: "Endpoints Policy §2.1.1, Run Configuration; §8.3, Measurement Point (point.yaml)."
  fix: "Omit `runtime_settings.client.api_key`, or keep the client's own `<redacted>` marker or an empty string - never a live key."
  severity: fail
  when:
    - { left: point.config.runtime_settings.client.api_key, op: not_null }
  assert:
    - {
        left: point.config.runtime_settings.client.api_key,
        op: in,
        right: ["", "<redacted>"],
      }

point_concurrency_positive:
  description: A fixed-concurrency run declares a positive concurrency.
  rule: "Endpoints Policy §6.1, Load Patterns; §8.3, Measurement Point (point.yaml)."
  fix: Set the run's concurrency above zero (a dedicated Offline run is exempt).
  severity: fail
  when:
    - { left: point.config.offline, op: ne, right: dedicated }
  assert:
    - { left: point.config.concurrency, op: gt, right: 0 }

point_offline_load_pattern:
  description: The dedicated Offline run declares the Offline load pattern (§6.1).
  rule: "Endpoints Policy §6.1, Load Patterns; §9.1, Load pattern."
  fix: "Declare `runtime_settings.load_pattern: max_throughput` for the dedicated Offline run."
  severity: fail
  when:
    - { left: point.config.offline, op: eq, right: dedicated }
  assert:
    - {
        left: point.config.runtime_settings.load_pattern,
        op: eq,
        right: max_throughput,
      }

point_warmup_present:
  description: The run declares its warmup block.
  rule: "Endpoints Policy §6.3.3, Warmup."
  fix: Add the run's `warmup` block to point.yaml.
  severity: fail
  assert:
    - { left: point.config.warmup, op: exists }

point_warmup_requests_ordered:
  description: Warmup completions do not exceed warmup issues.
  rule: "Endpoints Policy §8.3, Measurement Point (point.yaml)."
  fix: Fix the warmup counters so completed never exceeds issued.
  severity: fail
  when:
    - { left: point.config.warmup.requests_issued, op: exists }
    - { left: point.config.warmup.requests_completed, op: exists }
  assert:
    - left: point.config.warmup.requests_completed
      op: le
      right: point.config.warmup.requests_issued

point_warmup_logs_retained:
  description: Warmup request logs are retained for review.
  rule: "Endpoints Policy §6.3.2, Warmup Logs."
  fix: "Set `logs_retained: true` and keep the warmup logs with the submission."
  severity: warn
  when:
    - { left: point.config.warmup.duration_s, op: gt, right: 0 }
  assert:
    - { left: point.config.warmup.logs_retained, op: eq, right: true }

point_warmup_unsalted:
  description: The warmup enabled salt when it issued requests (§6.3.1 requires it for the client's performance-dataset warmup).
  rule: "Endpoints Policy §6.3.1, Prohibited Warmup Data."
  fix: "Set `runtime_settings.warmup.salt: true` (--warmup-salt) and disable KV cache reuse, or warm up from data outside the performance dataset."
  severity: warn
  when:
    - { left: point.config.warmup.requests_issued, op: gt, right: 0 }
  assert:
    - { left: point.config.runtime_settings.warmup.salt, op: eq, right: true }

point_duration_minimum:
  description: The ≤32-concurrency run measured for at least the ten-minute floor.
  rule: "Endpoints Policy §6.2, Minimum Run Duration; §9.1, Run duration."
  fix: Re-run at this concurrency for at least 600 s and re-submit.
  severity: warn
  when:
    - { left: point.config.concurrency, op: le, right: 32 }
  assert:
    - { left: point.result_summary.duration_ns, op: ge, right: 600000000000 }

point_duration_minimum_high_concurrency:
  description: The >32-concurrency run measured for at least the twenty-minute floor.
  rule: "Endpoints Policy §6.2, Minimum Run Duration; §9.1, Run duration."
  fix: Re-run at this concurrency for at least 1200 s and re-submit.
  severity: warn
  when:
    - { left: point.config.concurrency, op: gt, right: 32 }
    - { left: derived.agentic, op: eq, right: false }
  assert:
    - { left: point.result_summary.duration_ns, op: ge, right: 1200000000000 }

point_duration_minimum_high_concurrency_agentic:
  description: The >32-concurrency agentic run measured for at least the forty-minute floor.
  rule: "Endpoints Policy §6.2, Minimum Run Duration; §9.1, Run duration."
  fix: Re-run at this concurrency for at least 2400 s and re-submit.
  severity: warn
  when:
    - { left: point.config.concurrency, op: gt, right: 32 }
    - { left: derived.agentic, op: eq, right: true }
  assert:
    - { left: point.result_summary.duration_ns, op: ge, right: 2400000000000 }

point_output_tokens_present:
  description: The run reports its total output tokens.
  rule: "Endpoints Policy §14, Metric Consistency; §4.1, Metrics."
  fix: Re-run with a tokenizer so the summary carries output_sequence_lengths.total.
  severity: fail
  assert:
    - {
        left: point.result_summary.output_sequence_lengths.total,
        op: ge,
        right: 0,
      }

point_tpot_p90_positive:
  description: A fixed-concurrency run reports a positive P90 time-per-output-token.
  rule: "Endpoints Policy §9.1, Automated Checks; §4.1, Metrics; §6.5, Dataset Considerations."
  fix: Re-run with streaming so the summary carries a positive tpot.percentiles["90"] (the dedicated Offline run is exempt).
  severity: fail
  when:
    - { left: point.config.offline, op: ne, right: dedicated }
  assert:
    - { left: point.result_summary.tpot.percentiles.90, op: gt, right: 0 }

point_sample_count_floor:
  description: The run completed at least its dataset's §12 acceptance count.
  rule: "Endpoints Policy §12, Dataset Requirements; §6.4, Minimum Query Count."
  fix: Re-run until the completed sample count reaches the dataset's floor.
  severity: fail
  when:
    - { left: point.config.dataset_name, op: eq, right: cnn_dailymail }
  assert:
    - left: point.result_summary.n_samples_completed
      op: ge
      right: 13368

