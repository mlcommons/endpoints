point_accuracy_scores_present:
  description: The run carries at least one accuracy result.
  rule: "Endpoints Policy §5.3, Accuracy Runs; §15, Accuracy."
  fix: Run this point's accuracy dataset and ship its accuracy_results.json.
  severity: fail
  when:
    - { left: point.accuracy_results, op: exists }
  assert:
    - over: point.accuracy_results.accuracy_scores
      aggregate: count
      op: gt
      value: 0

point_accuracy_present:
  description: This point ships an accuracy_results.json.
  rule: "Endpoints Policy §5.3, Accuracy Runs; §1, Submission completeness."
  fix: Ship the accuracy result for this point (mandatory points need one).
  severity: warn
  assert:
    - { left: point.accuracy_results, op: exists }
point_offline_ordering:
  description: The dedicated Offline run meets §5.7.2's throughput and concurrency clauses.
  rule: "Endpoints Policy §5.7.2, Relationship to Maximum Supported Concurrency."
  fix: Raise the dedicated run's system_tps to 0.98x the C_max point's, or elect the C_max point as Offline.
  severity: fail
  when:
    - { left: point.config.offline, op: eq, right: dedicated }
  assert:
    - { left: derived.offline_ordering, op: eq, right: true }
