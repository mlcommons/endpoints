# Per-system checks (`results/<system>/`), every row citing the Endpoints Policy
# section it enforces (pinned at 4ba8224dc746).
#
# The §4.5.2 power descriptor and Appendix E's arithmetic, the per-point node
# declarations and the tps_utilization reconciliation are listed in
# ../2026-10-C1.md under "Not yet expressible": they need arithmetic across
# artifacts (node sets, parallelism, provisioned power) that a comparison row
# cannot perform. What is checked here is the declaration's presence and its
# §4.5.2 vocabulary.

system_power_declared:
  description: The system ships its §4.5.2 power declaration.
  rule: "Endpoints Policy §4.5.2, Power Measurement; Appendix E. Required for all Standardized submissions, CoP and CoN."
  fix: Ship results/<system>/system_power.json (Appendix E schema) with the submission.
  severity: warn
  assert:
    - { left: system.system_power.provisioned_power_kw, op: exists }

system_power_node_sets_present:
  description: The power descriptor declares at least one node set (Appendix E.1).
  rule: "Endpoints Policy §4.5.2, Power Measurement; Appendix E.1."
  fix: Declare each node set's provisioning in system_power.json.
  severity: fail
  when:
    - { left: system.system_power.node_sets, op: exists }
  assert:
    - over: system.system_power.node_sets
      aggregate: count
      op: gt
      value: 0

system_power_not_estimated:
  description: The reported power is a measured declaration, not an MLC estimate.
  rule: "Endpoints Policy §4.5.2, Power Measurement; Appendix D."
  fix: Replace the Appendix-D estimate with the vendor's published figure for the node set.
  severity: warn
  when:
    - { left: system.system_power.mlc_estimated_power, op: exists }
  assert:
    - { left: system.system_power.mlc_estimated_power, op: ne, right: true }
