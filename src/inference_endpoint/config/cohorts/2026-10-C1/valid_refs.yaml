# The facts a 2026-10-C1 row may name, declared exactly as the submission's own
# documents spell them (Endpoints Policy 4ba8224dc746: §8.3 point.yaml, §8.2
# system_desc.json, §4.1/§8.1 result_summary.json, §4.4 steady state, §4.6 seeds,
# §4.5.2 system_power.json).
#
# `field: dict` declares an open subtree: a row may name any deeper key under it
# and its values stay unchecked, while the value itself must be a block. A leaf
# carries the type the document must hold; `required: true` marks the facts the
# checker refuses a run for omitting at all (the parser-minimum trio plus
# `point.config.concurrency`); `nullable: true` admits an explicit `null` (the
# facts the client's own summary writes as null); `sensitive: true` keeps a
# fact's value out of row diagnostics (`(redacted)` stands in for it).

point:
  config:
    concurrency: { type: int, required: true }
    offline:
      {
        type: str,
        allowlist: [dedicated, elected, none],
        default: null,
        nullable: true,
      }
    region:
      {
        type: str,
        allowlist:
          [
            low_latency,
            low_concurrency,
            med_concurrency,
            high_concurrency,
            margin,
            submitters_choice,
          ],
        nullable: true,
      }
    seed_set: { type: str, nullable: true }
    target_cohort: { type: str, nullable: true }
    model_name: { type: str, nullable: true }
    model_precision: { type: str, nullable: true }
    model_notes: { type: str, nullable: true }
    dataset: { type: str, default: "" }
    dataset_name: { type: str, nullable: true }
    dataset_type: { type: str, nullable: true }
    dataset_link: { type: str, nullable: true }
    link_to_model: { type: str, nullable: true }
    link_to_model_transformation: { type: str, nullable: true }
    shared_src: { type: str, nullable: true }
    shared_docs: { type: str, nullable: true }
    division: { type: str, nullable: true }
    max_supported_concurrency: { type: int, nullable: true }
    nodes_used: { type: list, nullable: true }
    dp_shortfall: { type: dict, nullable: true }
    speculative_decoding: { type: dict, nullable: true }
    warmup:
      duration_s: { type: float }
      requests_issued: { type: int }
      requests_completed: { type: int }
      concurrency: { type: int }
      logs_retained: { type: bool, nullable: true }
      link_logs: { type: str, nullable: true }
      initialization_steps: { type: list }
      data_source: { type: str }
    steady_state:
      status:
        {
          type: str,
          allowlist:
            [
              windowable,
              insufficient_duration,
              insufficient_passes,
              partial_dataset,
            ],
          nullable: true,
        }
      # §4.4's verdicts; the trailing two are the legacy wire spellings the
      # round's own checker still reads.
      verdict:
        {
          type: str,
          allowlist:
            [
              steady_state,
              drifting_up,
              drifting_down,
              anomaly,
              not_found,
              "STEADY STATE",
              "not found",
            ],
          nullable: true,
        }
      window: dict
      state: dict
    # The canonical `RuntimeSettings` block of the submission's own schema.
    # The client's `Settings` shapes (a `load_pattern` block, the `client`/
    # `timeouts`/`profiling` subtrees) are not part of a point.yaml; a pasted
    # block still parses, its undeclared keys surfacing as ignored notes.
    runtime_settings:
      load_pattern:
        # §6.1's patterns; the schema's own default is `concurrency` (which
        # `Point.from_node` reads for the derivations too -- from the missing
        # block and the block without the key alike), and
        # `max_throughput` appears only on a dedicated Offline point, which
        # §6.1 exempts - the row enforces that pairing.
        {
          type: str,
          allowlist: [concurrency, agentic_inference, max_throughput],
          default: concurrency,
        }
      min_duration_ms: { type: int }
      min_sample_count: { type: int, nullable: true }
      stream_all_chunks: { type: bool }
      runtime:
        # §4.6's v1.0 spellings, then the v0.7 pair the schema still reads.
        scheduler_rng_seed: { type: int, nullable: true }
        sample_index_rng_seed: { type: int, nullable: true }
        model_seed: { type: int, nullable: true }
        scheduler_random_seed: { type: int, nullable: true }
        dataloader_random_seed: { type: int, nullable: true }
      warmup:
        salt: { type: bool, nullable: true }
      # Paste tolerance: a submitter who carries the client's `client` block
      # keeps its API key out of diagnostics (`sensitive` redacts it).
      client:
        api_key: { type: str, nullable: true, sensitive: true }
  system_desc:
    max_supported_concurrency: { type: int, required: true }
    c_min_override: { type: int, default: null }
    division: { type: str }
    cooling: { type: str }
    node_sets: { type: list }
    accelerators: dict
    tensor_parallel: { type: int }
    pipeline_parallel: { type: int }
    expert_parallel: { type: int }
    data_parallel: { type: int }
    tps_utilization: { type: float }
    host_processor_core_count: { type: int }
    host_processor_vcpu_count: { type: int }
  result_summary:
    system_tps: { type: float, required: true }
    complete: { type: bool }
    state: { type: str }
    qps: { type: float, nullable: true }
    duration_ns: { type: float, nullable: true }
    n_samples_issued: { type: int }
    n_samples_completed: { type: int }
    n_samples_failed: { type: int }
    n_samples_dropped: { type: int }
    output_sequence_lengths: dict
    output_sequence_lengths_full_run: { type: dict, nullable: true }
    ttft: dict
    tpot: dict
    latency: dict
    percentiles: dict
    isl: dict
    osl: dict
    tps_per_user: { type: float }
    tps_utilization: { type: float }
    system_tps_per_kw: { type: float }
    e2e_avg_interactivity: { type: float, nullable: true }
    # §4.4's reporting block: the client's `SteadyState` document; the tree's
    # `system_tps` alias reads `steady_state.window`/`.tps.system` out of it.
    steady_state: { type: dict, nullable: true }
    tps: { type: float, nullable: true }
    # The whole-run aggregate (`tps`) under its own name; `system_tps` is the
    # §4.4 official reading.
    full_run_system_tps: { type: float, nullable: true }
  accuracy_results: dict
  results: dict
  system_power:
    system_desc_id: { type: str }
    provisioned_power_kw: { type: float }
    cooling: { type: str }
    mlc_estimated_power: { type: bool }
    node_sets: { type: list }
    scale_out: dict
    computed: dict
    notes: { type: str }

system:
  system_power:
    system_desc_id: { type: str }
    provisioned_power_kw: { type: float }
    cooling: { type: str }
    mlc_estimated_power: { type: bool }
    node_sets: { type: list }
    scale_out: dict
    computed: dict
    notes: { type: str }
