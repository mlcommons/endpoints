# The 2026-10-C1 model catalog: the names §3.2 admits, spelled canonically, with
# each model's reference checkpoint and the accuracy targets §15 gates against.
#
# Sources, in order of authority:
#   - the admitted names, the accuracy targets and `min_queries`: the submission
#     checker's `accuracy_targets.py` (mlcommons/endpoints-submission-cli), which
#     transcribes the policy tables.
#   - `reference_id` / `reference_sha`: the model-spec draft in
#     docs/bench_suite_examples (public repo, commit 3bd1d0b1) where a name
#     matches, marked `reference_source: bench_suite_draft` -- that draft is
#     unverified, so treat the pins as provisional until the reference
#     repository publishes them.
#
# `accuracy_targets` keys are the metrics the scores are gated on, verbatim from
# the checker table; `tokens_per_sample` entries are bands (lower AND upper),
# everything else a lower bound. `min_queries` is the §12 smallest conforming
# acceptance count for the model's accuracy dataset.
#
# `accuracy_datasets` is the tie that gives those targets their subject: which
# set(s) a model's accuracy phase runs, and the run shape each one needs
# (`unit_samples` / `num_repeats`). The non-agentic entries come from the
# internal results checker's non-agentic rules JSON (`non-agentic-rules.json`),
# which keys the run shape by dataset *per model* -- the same set can need a
# different shape for a different model, which is why the tie cannot live on the
# dataset alone. A model whose accuracy sets this round does not declare carries
# `{}` rather than a guessed link. An agentic model ties each gate to what it
# reads instead: `agentic_combined` for the inline score, `swe_bench` for the
# mean-of-N, and the full-run summary field for the OSL band.

llama3_1-8b:
  name: llama3_1-8b
  family: llama3
  reference_id: meta-llama/Llama-3.1-8B-Instruct
  reference_sha: 0e9e39f249a16976918f6564b8830bc894c89659
  reference_source: bench_suite_draft
  accuracy_targets:
    rouge1: { lower: 38.7792, factor: 0.99 }
    rouge2: { lower: 15.9075, factor: 0.99 }
    rougel: { lower: 24.4957, factor: 0.99 }
    rougelsum: { lower: 35.793, factor: 0.99 }
    gen_len: { band: [7350879.6, 8984408.4], factor: 0.9 }
  min_queries: 13368
  accuracy_datasets: {}

gpt-oss-120b:
  name: gpt-oss-120b
  family: gpt-oss
  reference_id: openai/gpt-oss-120b
  reference_sha: b5c939de8f754692c1647ca79fbf85e8c1e70f8a
  reference_source: bench_suite_draft
  accuracy_targets:
    exact_match: { lower: 83.13, factor: 0.99 }
  min_queries: 4395
  agentic: false
  accuracy_datasets:
    # §15's `exact_match` gate is the unit_samples-weighted mean over these
    # three (the source's `aime25::gptoss`, `gpqa::gptoss`,
    # `livecodebench::gptoss` entries).
    aime25: { unit_samples: 30, num_repeats: 8 }
    gpqa: { unit_samples: 198, num_repeats: 5 }
    livecodebench: { unit_samples: 1055, num_repeats: 3 }

deepseek-r1:
