# The 2026-10-C1 dataset catalog: the sets the checks name, with the §12
# smallest conforming acceptance count and, where the internal submission rules
# publish them, the accuracy sets' unit sample counts and repeat counts.
#
# Sources:
#   - `min_queries`: the submission checker's `point_result.py` MIN_QUERY_COUNT
#     table (mlcommons/endpoints-submission-cli).
#   - `unit_samples` / `num_repeats`: the internal results checker's non-agentic
#     rules JSON (`non-agentic-rules.json`), its transcription of the reference
#     accuracy runs.
#
# The document is the mapping `Catalog.from_directory` reads: each top-level key
# is a dataset, each value a raw dict a `ruleset.datasets.<name>.<key>` row
# addresses.

