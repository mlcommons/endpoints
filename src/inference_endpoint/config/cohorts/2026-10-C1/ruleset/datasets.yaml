# The 2026-10-C1 dataset catalog: the sets the checks name, and the §12 smallest
# conforming acceptance count each one needs.
#
# Sources:
#   - `min_queries`: the submission checker's `point_result.py` MIN_QUERY_COUNT
#     table (mlcommons/endpoints-submission-cli), which transcribes the policy
#     tables.
#   - `dataset_type`: this round's own declaration of the phase that runs it.
#
# An accuracy set's per-model run shape (`unit_samples`, `num_repeats`) lives on
# the model's `accuracy_datasets` tie in models.yaml: the same set can need a
# different shape for a different model, so it cannot live on the dataset entry.
# `agentic_combined` and `swe_bench` are the agentic gates' sets (models.yaml);
# the checker publishes no §12 acceptance count for either.
#
# The document is the mapping `Catalog.from_directory` reads: each top-level key
# is a dataset, each value a raw dict a `ruleset.datasets.<name>.<key>` row
# addresses.

cnn_dailymail:
