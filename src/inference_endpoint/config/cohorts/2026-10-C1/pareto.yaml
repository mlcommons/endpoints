# Per-pareto checks (`results/<system>/<model>/`), every row citing the Endpoints
# Policy section it enforces (pinned at 4ba8224dc746).
#
# A pareto row may name `pareto.…` facts, the coarser `system.`/`submission.`
# namespaces, and the per-pareto `derived.*`/`regions.*` names. Counting over
# the pareto's points is available as `derived.point_count`,
# `derived.uncovered_regions`, `derived.offline_points` and the two accuracy
# coverage derivations; what a row still cannot do -- compare a point
# to the curve's maximum, or place a point in a computed region band -- is
# listed in ../2026-10-C1.md under "Not yet expressible", with the reason.

pareto_point_cap:
  description: The pareto traces at most 32 measurement points (§5.6's cap).
  rule: "Endpoints Policy §5.6, Submission Size."
  fix: Drop the extra points; a pareto carries at most 32 runs.
  severity: fail
  assert:
    - { left: derived.point_cap, op: eq, right: true }

pareto_out_of_range_points:
  description: No point sits outside every region, margins included (§5.4/§9).
  rule: "Endpoints Policy §9.1, Automated Checks; §5.4, C_min."
  fix: Re-run flagged points inside a covered region, or fix the declared C_min override.
  severity: fail
  assert:
    - over: derived.out_of_range_points
      aggregate: count
      op: eq
      value: 0

pareto_point_count_min:
  description: The pareto carries at least §5.3's minimum number of measurement points.
  rule: "Endpoints Policy §5.3, Minimum Submission Requirements; §9.1, Point count."
  fix: Add measurement points until this pareto's shape carries its §5.3 minimum.
  severity: fail
  assert:
    - { left: derived.point_count, op: ge, right: derived.point_count_min }

pareto_region_coverage:
  description: Every mandatory concurrency region carries at least one measurement point.
  rule: "Endpoints Policy §5.4, Regions of Interest; §9.1, Concurrency coverage."
  fix: Add a measurement point inside each uncovered region the finding lists.
  severity: fail
  assert:
    - { over: derived.uncovered_regions, aggregate: count, op: eq, value: 0 }

pareto_offline_present:
  description: A non-agentic pareto carries its one Offline declaration (§5.7).
  rule: "Endpoints Policy §5.7, Offline Point; §9.1, Offline point present."
  fix: Declare exactly one point as the Offline result (a dedicated run, or the elected C_max point).
  severity: fail
  when:
    - { left: derived.agentic, op: eq, right: false }
  assert:
    - { over: derived.offline_points, aggregate: count, op: ge, value: 1 }

pareto_offline_absent_for_agentic:
  description: An agentic pareto carries no Offline declaration (§5.7).
  rule: "Endpoints Policy §5.7, Offline Point; §9.1, Offline point present."
  fix: Drop the `offline` declaration; an agentic submission may not include an Offline point.
  severity: fail
  when:
    - { left: derived.agentic, op: eq, right: true }
  assert:
    - { over: derived.offline_points, aggregate: count, op: eq, value: 0 }

pareto_accuracy_coverage:
  description: The pareto's accuracy validation runs cover each §5.3 mandatory region.
  rule: "Endpoints Policy §4.3, Accuracy Metric; §5.3, Accuracy Runs."
  fix: Run and ship an accuracy result at a point in each uncovered region.
  severity: fail
  assert:
    - {
        over: derived.accuracy_uncovered_regions,
        aggregate: count,
        op: eq,
        value: 0,
      }

pareto_offline_accuracy:
  description: The Offline point carries its §4.3 accuracy validation result.
  rule: "Endpoints Policy §4.3, Accuracy Metric; §5.7, Offline Result."
  fix: Run and ship the Offline point's accuracy result.
  severity: fail
  assert:
    - {
        over: derived.offline_points_missing_accuracy,
        aggregate: count,
        op: eq,
        value: 0,
      }

pareto_model_name_admitted:
  description: The declared model is one the round's ruleset admits (§3.2).
  rule: "Endpoints Policy §3.2, Benchmark Model."
  fix: Declare a model the catalog names (see `ruleset/models.yaml`).
  severity: fail
  when:
    - { left: ruleset.models, op: exists }
  assert:
    - { left: derived.model_name_admitted, op: eq, right: true }

pareto_benchmark_type_consistency:
  description: The curve's type-voting points agree on the load pattern (§8.5).
  rule: "Endpoints Policy §8.5, Curve Consistency; §6.1, Load Patterns."
  fix: Declare one load pattern across the point files (a dedicated Offline run may differ).
  severity: fail
  assert:
    - {
        over: derived.conflicting_load_patterns,
        aggregate: count,
        op: eq,
        value: 0,
      }

pareto_config_model_consistency:
  description: Every point of the curve declares the same model name (§9.1).
  rule: "Endpoints Policy §9.1, Configuration Consistency; §8.3, Measurement Point."
  fix: Declare one `model_name` across the point files.
  severity: fail
  assert:
    - {
        over: derived.conflicting_model_names,
        aggregate: count,
        op: eq,
        value: 0,
      }

pareto_config_dataset_consistency:
  description: Every point of the curve declares the same dataset id (§9.1).
  rule: "Endpoints Policy §9.1, Configuration Consistency; §8.3, Measurement Point."
  fix: Declare one `dataset` across the point files.
  severity: fail
  assert:
    - { over: derived.conflicting_datasets, aggregate: count, op: eq, value: 0 }

pareto_seed_set_consistency:
  description: Every point of the curve records the same seed set (§9.1).
  rule: "Endpoints Policy §9.1, Configuration Consistency; §4.6, Seeds."
  fix: Bind every point of the curve to one published seed set.
  severity: fail
  assert:
    - {
        over: derived.conflicting_seed_sets,
        aggregate: count,
        op: eq,
        value: 0,
      }

pareto_system_desc_consistency:
  description: Every point of the curve describes the same system (§8.5).
  rule: "Endpoints Policy §8.5, Curve Consistency; §8.1, System Description."
  fix: Align the point files' system descriptions (only the per-point parallelism/batch fields may differ).
  severity: fail
  assert:
    - {
        over: derived.inconsistent_system_desc_keys,
        aggregate: count,
        op: eq,
        value: 0,
      }

pareto_metric_consistency_accounting:
  description: Every summary's completed and failed samples add up to its issued count (§14).
  rule: "Endpoints Policy §14, Metric Consistency; §9.1, Automated Checks."
  fix: Re-run the flagged points; `n_samples_completed + n_samples_failed` must equal `n_samples_issued`.
  severity: fail
  assert:
    - {
        over: derived.accounting_mismatch_points,
        aggregate: count,
        op: eq,
        value: 0,
      }

pareto_metric_consistency_system_tps:
  description: Every summary's stored system_tps equals its output tokens over its duration (§9.1).
  rule: "Endpoints Policy §9.1, Automated Checks; §14, Metric Consistency."
  fix: Re-run the flagged points; the summary's throughput must be `output_sequence_lengths.total / duration_s`.
  severity: fail
  assert:
    - {
        over: derived.system_tps_mismatch_points,
        aggregate: count,
        op: eq,
        value: 0,
      }

pareto_region_placement:
  description: Every declared region matches the band its concurrency computes (§8.3).
  rule: "Endpoints Policy §5.5, Concurrency Regions; §8.3, Measurement Point."
  fix: Correct the flagged points' `region`, or drop it where the band is intentional (`submitters_choice`).
  severity: warn
  assert:
    - {
        over: derived.misplaced_region_points,
        aggregate: count,
        op: eq,
        value: 0,
      }

pareto_tps_utilization:
  description: Every declared system_desc tps_utilization equals the point's share of its curve's peak throughput (§8.2).
  rule: "Endpoints Policy §8.2, System Description; §9.1, Automated Checks."
  fix: Recompute the flagged points' `tps_utilization` as `system_tps / max(system_tps)` over the curve.
  severity: fail
  assert:
    - {
        over: derived.tps_utilization_mismatch_points,
        aggregate: count,
        op: eq,
        value: 0,
      }
